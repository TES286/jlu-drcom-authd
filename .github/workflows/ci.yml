# SPDX-License-Identifier: AGPL-3.0-or-later
# CI for jlu-drcom-authd.
#
# Builds and tests the project on amd64 (native) and arm64 (using
# GitHub's native arm64 runners), builds Debian packages, and
# publishes release artifacts on tag push.

name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  format-check:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: |
          # Check every tracked .c/.h file.  Fail on any diff.
          mapfile -t files < <(git ls-files '*.c' '*.h')
          if [ ${#files[@]} -eq 0 ]; then
            echo "no C files to check"
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

  build-and-test:
    name: Build & test (${{ matrix.arch }})
    needs: format-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libsystemd-dev python3

      - name: Configure
        run: |
          meson setup build \
            --werror \
            -Dtests=enabled \
            -Db_lto=true

      - name: Build
        run: meson compile -C build

      - name: Run unit tests
        run: meson test -C build --print-errorlogs --no-suite=e2e

      - name: Run E2E test
        run: meson test -C build --print-errorlogs --suite=e2e

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.arch }}
          path: |
            build/meson-logs/
            build/testlog.txt

  deb-package:
    name: Build .deb (${{ matrix.arch }})
    needs: format-check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libsystemd-dev python3 \
            debhelper dh-make dpkg-dev

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          # Move the built .deb and metadata into the repo for artifact upload.
          mkdir -p artifacts
          mv ../jlu-drcom-authd_*.deb artifacts/ 2>/dev/null || true
          mv ../jlu-drcom-authd_*.buildinfo artifacts/ 2>/dev/null || true
          mv ../jlu-drcom-authd_*.changes artifacts/ 2>/dev/null || true

      - name: Verify package contents
        run: |
          for deb in artifacts/*.deb; do
            echo "=== $deb ==="
            dpkg-deb --info "$deb" | head -20
            echo "--- contents ---"
            dpkg-deb --contents "$deb"
          done

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: artifacts/*.deb

  release:
    name: Release (on tag)
    needs: [format-check, build-and-test, deb-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config libsystemd-dev
      - name: Build release
        run: |
          meson setup build --buildtype=release -Dtests=disabled
          meson compile -C build
      - name: Package tarball
        run: |
          arch=$(uname -m)
          mkdir -p dist/sbin dist/lib/systemd/system dist/etc/jlu-drcom-authd
          cp build/src/jlu-drcom-authd dist/sbin/
          cp systemd/jlu-drcom-authd.service systemd/jlu-drcom-authd@.service dist/lib/systemd/system/
          cp systemd/jlu-drcom-authd.conf.example dist/etc/jlu-drcom-authd/
          tar -czf jlu-drcom-authd-${{ github.ref_name }}-${arch}.tar.gz -C dist .
      - name: Download amd64 .deb
        uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: debs-amd64
      - name: Download arm64 .deb
        uses: actions/download-artifact@v4
        with:
          name: deb-arm64
          path: debs-arm64
      - name: Collect release files
        run: |
          mkdir -p release
          cp jlu-drcom-authd-*.tar.gz release/
          cp debs-amd64/*.deb release/jlu-drcom-authd_${{ github.ref_name }}_amd64.deb 2>/dev/null || true
          cp debs-arm64/*.deb release/jlu-drcom-authd_${{ github.ref_name }}_arm64.deb 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
